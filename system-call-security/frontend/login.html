<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login – Secure System Call Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="nav-brand">Secure System Call Interface</div>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="login.html" class="active">Login</a>
        <a href="dashboard.html">Dashboard</a>
      </nav>
    </header>

    <div class="center-wrapper">
      <div class="card center-card">
        <h2 class="mb-3">Login to Access System Calls</h2>
        <p class="text-muted mb-3">
          Use demo credentials:
          <br />Admin – <b>admin / admin123</b><br />User – <b>user /
            user123</b>
        </p>

        <form id="login-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input id="username" name="username" required autocomplete="off" />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              required
            />
          </div>

          <button type="submit" class="btn-primary btn-small" style="width:100%">
            Log In
          </button>
        </form>

        <p id="login-message" class="text-muted mt-3 mb-2" style="text-align:center; min-height: 20px;"></p>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
