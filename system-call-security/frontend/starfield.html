<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta-name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starfield Background</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: white;
            min-height: 200vh; /* just to show scrolling */
        }

        /* ⭐ Background Canvas Layer */
        #star-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;      /* Behind everything */
            pointer-events: none; /* So user can click through it */
            display: block;
            background: radial-gradient(ellipse at center, #0f0f23 0%, #000 100%);
        }

        /* Example content */
        .content {
            padding: 50px;
            z-index: 10;
            position: relative;
        }
    </style>
</head>

<body>

    <!-- ⭐ BACKGROUND CANVAS -->
    <canvas id="star-canvas"></canvas>


   

    <script>
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');

        let stars = [];
        let mouse = { x: 0, y: 0 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            let numStars = 150;

            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    size: Math.random() * 2 + 0.5,
                    brightness: Math.random(),
                    twinkleSpeed: Math.random() * 0.02 + 0.01,
                    layer: Math.floor(Math.random() * 3)
                });
            }
        }

        function updateStars() {
            stars.forEach(star => {
                const dx = mouse.x - star.x;
                const dy = mouse.y - star.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const influence = Math.max(0, 1 - distance / 200);

                const layerSpeed = [0.3, 0.6, 1][star.layer];
                const speed = 1;

                star.x += star.vx * speed * layerSpeed + dx * influence * 0.01 * layerSpeed;
                star.y += star.vy * speed * layerSpeed + dy * influence * 0.01 * layerSpeed;

                if (star.x < 0) star.x = canvas.width;
                if (star.x > canvas.width) star.x = 0;
                if (star.y < 0) star.y = canvas.height;
                if (star.y > canvas.height) star.y = 0;

                star.brightness += star.twinkleSpeed;
                if (star.brightness > 1 || star.brightness < 0.3) {
                    star.twinkleSpeed = -star.twinkleSpeed;
                }
            });
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                ctx.save();
                ctx.globalAlpha = star.brightness;
                ctx.fillStyle = "#fff";
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function animate() {
            updateStars();
            drawStars();
            requestAnimationFrame(animate);
        }

        window.addEventListener("resize", resizeCanvas);
        window.addEventListener("mousemove", (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        resizeCanvas();
        animate();
    </script>

</body>
</html>
